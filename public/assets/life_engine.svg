<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="lifeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101d"/>
      <stop offset="50%" stop-color="#14192b"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>
    <linearGradient id="glowPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bd00ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="cardLife" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#192238" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#0f1626" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="nodeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="url(#lifeBg)"/>

  <!-- Subtle neural/graph grid -->
  <g opacity="0.1" stroke="#818cf8" stroke-width="1">
    <circle cx="600" cy="337" r="150" fill="none" stroke-dasharray="4,8"/>
    <circle cx="600" cy="337" r="300" fill="none" stroke-dasharray="6,12"/>
    <circle cx="600" cy="337" r="450" fill="none" stroke-dasharray="8,16"/>
  </g>

  <!-- Top App Header -->
  <rect x="50" y="30" width="1100" height="60" rx="14" fill="#131b2e" stroke="#232f4a" stroke-width="1.5"/>
  <circle cx="85" cy="60" r="7" fill="#ef4444"/>
  <circle cx="110" cy="60" r="7" fill="#f59e0b"/>
  <circle cx="135" cy="60" r="7" fill="#10b981"/>
  
  <text x="170" y="65" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Personalized Life Engine</text>
  <text x="400" y="65" font-family="'JetBrains Mono', monospace" font-size="12" fill="#818cf8">| Unified Life &amp; Career Operating System</text>

  <rect x="870" y="45" width="130" height="30" rx="15" fill="#3b82f6" fill-opacity="0.2" stroke="#60a5fa"/>
  <text x="890" y="65" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#60a5fa">Sync Active (v2.4)</text>

  <rect x="1015" y="45" width="115" height="30" rx="15" fill="#bd00ff" fill-opacity="0.2" stroke="#c084fc"/>
  <text x="1035" y="65" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#c084fc">AI Graph Ready</text>

  <!-- Left Column: Core Life Pillars -->
  <rect x="50" y="110" width="350" height="515" rx="16" fill="url(#cardLife)" stroke="#232f4a" stroke-width="1.5"/>
  <text x="80" y="150" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Connected Ecosystem</text>
  <text x="80" y="172" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Active Modules &amp; Roadmaps</text>

  <!-- Pillar 1: Career Applications (Completed) -->
  <g transform="translate(80, 195)">
    <rect x="0" y="0" width="290" height="60" rx="10" fill="#0e172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Career &amp; Applications Tracker</text>
    <text x="20" y="47" font-family="'Inter', sans-serif" font-size="11" fill="#10b981">✓ Implemented · Pipeline &amp; Offers</text>
  </g>

  <!-- Pillar 2: Goal & Project Tracking (Completed) -->
  <g transform="translate(80, 270)">
    <rect x="0" y="0" width="290" height="60" rx="10" fill="#0e172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Goal &amp; Project Missions</text>
    <text x="20" y="47" font-family="'Inter', sans-serif" font-size="11" fill="#10b981">✓ Implemented · Milestone trees</text>
  </g>

  <!-- Pillar 3: Habit & Productivity Analytics (Completed) -->
  <g transform="translate(80, 345)">
    <rect x="0" y="0" width="290" height="60" rx="10" fill="#0e172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#ffffff">Habit &amp; Focus Rhythm</text>
    <text x="20" y="47" font-family="'Inter', sans-serif" font-size="11" fill="#10b981">✓ Implemented · Daily streaks</text>
  </g>

  <!-- Pillar 4: Autonomous AI Engine (Upcoming) -->
  <g transform="translate(80, 420)">
    <rect x="0" y="0" width="290" height="60" rx="10" fill="#0e172a" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="20" y="27" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#f59e0b">Automated AI Task Synthesis</text>
    <text x="20" y="47" font-family="'Inter', sans-serif" font-size="11" fill="#94a3b8">⏳ Upcoming Phase · Multi-agent</text>
  </g>

  <!-- Metric Widget -->
  <rect x="80" y="505" width="290" height="95" rx="10" fill="#0c1220" stroke="#232f4a"/>
  <text x="100" y="535" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Active Goal Velocity</text>
  <text x="100" y="565" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#00f5ff">92% Weekly Completion</text>
  <text x="100" y="585" font-family="'Inter', sans-serif" font-size="11" fill="#10b981">↑ 18% improvement with AI planning</text>

  <!-- Right: Interconnected Graph Visualization -->
  <rect x="425" y="110" width="725" height="515" rx="16" fill="url(#cardLife)" stroke="#232f4a" stroke-width="1.5"/>
  <text x="455" y="150" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Interconnected Knowledge &amp; Execution Graph</text>
  <text x="455" y="172" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Real-time relational state across Goals, Habits, Projects &amp; Applications</text>

  <!-- Graph Nodes and Edges -->
  <g transform="translate(450, 160)">
    <!-- Connecting lines -->
    <line x1="335" y1="180" x2="160" y2="80" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.4"/>
    <line x1="335" y1="180" x2="510" y2="80" stroke="#bd00ff" stroke-width="2" stroke-opacity="0.4"/>
    <line x1="335" y1="180" x2="120" y2="280" stroke="#10b981" stroke-width="2" stroke-opacity="0.4"/>
    <line x1="335" y1="180" x2="550" y2="280" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.4"/>
    <line x1="160" y1="80" x2="510" y2="80" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.3"/>
    <line x1="120" y1="280" x2="550" y2="280" stroke="#818cf8" stroke-width="1" stroke-dasharray="4,4" stroke-opacity="0.3"/>

    <!-- Central Node: Life Engine Core -->
    <circle cx="335" cy="180" r="50" fill="url(#glowPurple)" filter="url(#nodeGlow)"/>
    <text x="305" y="178" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#ffffff">LIFE</text>
    <text x="296" y="196" font-family="'Inter', sans-serif" font-size="13" font-weight="800" fill="#ffffff">ENGINE</text>

    <!-- Node 1: Career Applications -->
    <circle cx="160" cy="80" r="38" fill="#0e2338" stroke="#00f5ff" stroke-width="2"/>
    <text x="135" y="84" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#00f5ff">Careers</text>

    <!-- Node 2: Core Goals -->
    <circle cx="510" cy="80" r="38" fill="#25103a" stroke="#bd00ff" stroke-width="2"/>
    <text x="488" y="84" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#bd00ff">Goals</text>

    <!-- Node 3: Projects & Tasks -->
    <circle cx="120" cy="280" r="38" fill="#082b20" stroke="#10b981" stroke-width="2"/>
    <text x="95" y="284" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#10b981">Projects</text>

    <!-- Node 4: AI Insights -->
    <circle cx="550" cy="280" r="38" fill="#301f09" stroke="#f59e0b" stroke-width="2"/>
    <text x="520" y="284" font-family="'Inter', sans-serif" font-size="11" font-weight="700" fill="#f59e0b">AI Coach</text>

    <!-- Status Info Tag -->
    <rect x="150" y="375" width="370" height="40" rx="8" fill="#0d182e" stroke="#1e2f50"/>
    <text x="175" y="400" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">Active: 6 Goals · 14 Projects · 8 Applications</text>
  </g>
</svg>
