<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a101f"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bd00ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  
  <!-- Subtle Grid -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="135" x2="1200" y2="135" stroke-dasharray="4,8"/>
    <line x1="0" y1="270" x2="1200" y2="270" stroke-dasharray="4,8"/>
    <line x1="0" y1="405" x2="1200" y2="405" stroke-dasharray="4,8"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke-dasharray="4,8"/>
    <line x1="240" y1="0" x2="240" y2="675" stroke-dasharray="4,8"/>
    <line x1="480" y1="0" x2="480" y2="675" stroke-dasharray="4,8"/>
    <line x1="720" y1="0" x2="720" y2="675" stroke-dasharray="4,8"/>
    <line x1="960" y1="0" x2="960" y2="675" stroke-dasharray="4,8"/>
  </g>

  <!-- Glowing Accent Orbs -->
  <circle cx="1000" cy="150" r="140" fill="#00f5ff" opacity="0.08" filter="url(#glow)"/>
  <circle cx="200" cy="500" r="180" fill="#bd00ff" opacity="0.07" filter="url(#glow)"/>

  <!-- Top Navigation Bar Header Simulation -->
  <rect x="60" y="40" width="1080" height="60" rx="12" fill="#131e33" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="95" cy="70" r="7" fill="#ef4444"/>
  <circle cx="120" cy="70" r="7" fill="#f59e0b"/>
  <circle cx="145" cy="70" r="7" fill="#10b981"/>
  
  <rect x="180" y="55" width="220" height="30" rx="6" fill="#1e293b"/>
  <text x="210" y="75" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#38bdf8">AI Resume Screener</text>
  
  <rect x="940" y="55" width="160" height="30" rx="15" fill="url(#cyanGrad)" opacity="0.2"/>
  <rect x="940" y="55" width="160" height="30" rx="15" fill="none" stroke="#00f5ff" stroke-width="1"/>
  <text x="965" y="75" font-family="'Inter', sans-serif" font-size="12" font-weight="700" fill="#00f5ff">⚡ Fast Match 98.4%</text>

  <!-- Left Panel: Resume Ingestion & Parsing -->
  <rect x="60" y="125" width="340" height="490" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <text x="90" y="165" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Document Ingestion</text>
  <text x="90" y="185" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">PDF, DOCX &amp; TXT Multi-Parser</text>

  <!-- Upload box simulation -->
  <rect x="90" y="210" width="280" height="110" rx="12" fill="#132038" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6,6"/>
  <circle cx="230" cy="250" r="18" fill="#1e293b"/>
  <path d="M225 255 L230 245 L235 255 Z" fill="#38bdf8"/>
  <text x="145" y="295" font-family="'Inter', sans-serif" font-size="12" font-weight="500" fill="#94a3b8">Resume parsed: <tspan fill="#38bdf8">Candidate_CV.pdf</tspan></text>

  <!-- Extracted Entities -->
  <text x="90" y="355" font-family="'Inter', sans-serif" font-size="13" font-weight="700" fill="#38bdf8">EXTRACTED ENTITIES</text>
  
  <g transform="translate(90, 375)">
    <rect x="0" y="0" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="10" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">Python</text>
    
    <rect x="95" y="0" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="105" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">FastAPI</text>

    <rect x="190" y="0" width="85" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="200" y="17" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">PyTorch</text>
    
    <rect x="0" y="36" width="95" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="10" y="53" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">PostgreSQL</text>

    <rect x="105" y="36" width="115" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="115" y="53" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">Transformers</text>

    <rect x="0" y="72" width="130" height="26" rx="6" fill="#1e293b" stroke="#334155"/>
    <text x="10" y="89" font-family="'JetBrains Mono', monospace" font-size="11" fill="#e2e8f0">Semantic Search</text>
  </g>

  <!-- Parsing Metrics -->
  <rect x="90" y="500" width="280" height="85" rx="10" fill="#0c1322" stroke="#1e293b"/>
  <text x="110" y="530" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Semantic Vector Dim</text>
  <text x="110" y="555" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#00f5ff">768-D Embeddings</text>
  <text x="270" y="530" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Match Engine</text>
  <text x="270" y="555" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700" fill="#10b981">Cosine Sim</text>

  <!-- Right Panel: Intelligent Ranking & Recruiter Dashboard -->
  <rect x="425" y="125" width="715" height="490" rx="16" fill="url(#cardGrad)" stroke="#334155" stroke-width="1.5"/>
  <text x="455" y="165" font-family="'Inter', sans-serif" font-size="18" font-weight="700" fill="#ffffff">Intelligent Candidate Ranking &amp; Explainable Scoring</text>
  <text x="455" y="188" font-family="'Inter', sans-serif" font-size="13" fill="#94a3b8">Target Role: Senior Full Stack / AI Engineer · 42 Resumes Analyzed</text>

  <!-- Candidate Row 1 (Top Rank) -->
  <rect x="455" y="215" width="655" height="90" rx="12" fill="#122038" stroke="#00f5ff" stroke-width="1.5"/>
  <circle cx="490" cy="260" r="22" fill="#00f5ff" opacity="0.15"/>
  <text x="483" y="266" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#00f5ff">#1</text>
  
  <text x="525" y="250" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Alex Vance</text>
  <text x="525" y="272" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Full Stack AI Developer · 4.5 YOE · Spring Boot, React, NLP</text>

  <!-- Match Score Indicator -->
  <rect x="990" y="235" width="95" height="50" rx="8" fill="#0c1a2e" stroke="#00f5ff"/>
  <text x="1008" y="260" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#00f5ff">94.8%</text>
  <text x="1016" y="276" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">MATCH</text>

  <!-- Candidate Row 2 -->
  <rect x="455" y="320" width="655" height="90" rx="12" fill="#0f192b" stroke="#334155" stroke-width="1"/>
  <circle cx="490" cy="365" r="22" fill="#8b5cf6" opacity="0.15"/>
  <text x="483" y="371" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#bd00ff">#2</text>
  
  <text x="525" y="355" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">Sarah Lin</text>
  <text x="525" y="377" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Python / ML Engineer · 3 YOE · FastAPI, PyTorch, PostgreSQL</text>

  <rect x="990" y="340" width="95" height="50" rx="8" fill="#0c1a2e" stroke="#bd00ff"/>
  <text x="1008" y="365" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#bd00ff">89.2%</text>
  <text x="1016" y="381" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">MATCH</text>

  <!-- Candidate Row 3 -->
  <rect x="455" y="425" width="655" height="90" rx="12" fill="#0f192b" stroke="#334155" stroke-width="1"/>
  <circle cx="490" cy="470" r="22" fill="#10b981" opacity="0.15"/>
  <text x="483" y="476" font-family="'Inter', sans-serif" font-size="16" font-weight="800" fill="#10b981">#3</text>
  
  <text x="525" y="460" font-family="'Inter', sans-serif" font-size="16" font-weight="700" fill="#ffffff">David Kumar</text>
  <text x="525" y="482" font-family="'Inter', sans-serif" font-size="12" fill="#94a3b8">Backend Engineer · 5 YOE · Java, Distributed Systems, SQL</text>

  <rect x="990" y="445" width="95" height="50" rx="8" fill="#0c1a2e" stroke="#10b981"/>
  <text x="1008" y="470" font-family="'Inter', sans-serif" font-size="20" font-weight="800" fill="#10b981">85.4%</text>
  <text x="1016" y="486" font-family="'Inter', sans-serif" font-size="10" font-weight="600" fill="#94a3b8">MATCH</text>

  <!-- Insight banner at bottom -->
  <rect x="455" y="530" width="655" height="60" rx="10" fill="#13233c" stroke="#1e3a5f"/>
  <text x="480" y="565" font-family="'Inter', sans-serif" font-size="12" fill="#38bdf8">💡 <tspan font-weight="700">Explainable AI Insight:</tspan> High semantic correlation identified in architectural design patterns and REST API scale benchmarks.</text>
</svg>
